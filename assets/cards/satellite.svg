<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Four climate datasets pulled through Earth Engine and aligned on one monthly 1-degree grid"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="319" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="40" y="30" width="220" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="150.0" y="54.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">ERA5-Land</text><text x="150.0" y="76.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">soil water, snow</text><path d="M260 58 C330 58 330 160 376 160" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="100" width="220" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="150.0" y="124.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">GLDAS</text><text x="150.0" y="146.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">land model</text><path d="M260 128 C330 128 330 160 376 160" fill="none" stroke="#8c959f" stroke-width="1.6"/><rect x="40" y="170" width="220" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="150.0" y="194.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">FLDAS</text><text x="150.0" y="216.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">Africa land model</text><path d="M260 198 C330 198 330 160 376 160" fill="none" stroke="#8c959f" stroke-width="1.6"/><rect x="40" y="240" width="220" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="150.0" y="264.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">IMERG</text><text x="150.0" y="286.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">rainfall</text><path d="M260 268 C330 268 330 160 376 160" fill="none" stroke="#8c959f" stroke-width="1.6"/><rect x="380" y="120" width="200" height="80" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="480.0" y="156.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Earth Engine</text><text x="480.0" y="178.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">pull + reproject</text><path d="M580 160 H636" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="120" width="280" height="80" rx="9" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><text x="780.0" y="156.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">1° land grid, monthly</text><text x="780.0" y="178.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">one aligned table</text></svg>