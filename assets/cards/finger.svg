<svg xmlns="http://www.w3.org/2000/svg" width="960" height="246" viewBox="0 0 960 246" role="img" aria-label="Wrong-person match rate by approach: DINOv2 features best at 3.3%"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="245" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="40" y="40" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">Wrong person accepted, by approach (lower is better, 16-person test)</text><text x="40" y="82" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Off-the-shelf fingerprint model</text><rect x="330" y="66" width="360" height="22" rx="5" fill="#8c959f" class="grow" style="animation-delay:0.0s"/><text x="702.0" y="83" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">fails: every pair looks alike</text><text x="40" y="126" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">EfficientNet features</text><rect x="330" y="110" width="39" height="22" rx="5" fill="#8c959f" class="grow" style="animation-delay:0.25s"/><text x="380.52" y="127" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">10.7%</text><text x="40" y="170" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">DINOv2 features</text><rect x="330" y="154" width="12" height="22" rx="5" fill="#c2410c" class="grow" style="animation-delay:0.5s"/><text x="353.88" y="171" font-size="15" font-weight="650" fill="#c2410c" text-anchor="start">3.3%, best</text><text x="40" y="214" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">DINOv2 + ridge filter</text><rect x="330" y="198" width="81" height="22" rx="5" fill="#8c959f" class="grow" style="animation-delay:0.75s"/><text x="422.64" y="215" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">22.4%, filter made it worse</text></svg>