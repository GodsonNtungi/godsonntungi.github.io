<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-label="Edge gate system: plate trigger, multi-camera snapshot, model chain, local store that syncs later"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="291" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="40" y="40" width="170" height="60" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="125.0" y="66.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Plate camera</text><text x="125.0" y="88.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">30 frames a second</text><rect x="40" y="150" width="170" height="60" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="125.0" y="186.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Other cameras</text><rect x="280" y="40" width="200" height="60" rx="9" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><text x="380.0" y="66.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Plate detector</text><text x="380.0" y="88.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">YOLO, 15-30 ms</text><path d="M210 70 H276" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="280" y="150" width="200" height="60" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="380.0" y="176.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Snapshot all</text><text x="380.0" y="198.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">on trigger</text><path d="M380 100 V146" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M210 180 H276" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="560" y="40" width="170" height="50" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="645.0" y="71.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Read plate</text><rect x="560" y="104" width="170" height="50" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="645.0" y="135.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Count heads</text><rect x="560" y="168" width="170" height="50" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="645.0" y="199.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Match across cams</text><path d="M790 90 v80 a65.0 10 0 0 0 130 0 v-80" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><ellipse cx="855.0" cy="90" rx="65.0" ry="10" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><text x="855.0" y="138.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">SQLite</text><text x="855.0" y="160.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">syncs later</text><path d="M480 180 C520 180 520 65 556 65" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M730 65 C760 65 760 130 786 130" fill="none" stroke="#8c959f" stroke-width="1.6"/><path d="M480 180 C520 180 520 129 556 129" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M730 129 C760 129 760 130 786 130" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M480 180 C520 180 520 193 556 193" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M730 193 C760 193 760 130 786 130" fill="none" stroke="#8c959f" stroke-width="1.6"/><text x="40" y="268" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">All on one edge computer: 200 to 350 ms from trigger to record, and it works offline.</text></svg>