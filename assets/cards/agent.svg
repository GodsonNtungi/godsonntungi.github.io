<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="One tool-calling agent behind web, WhatsApp and SMS, with each business domain as its own MCP server"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="319" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="40" y="40" width="180" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="130.0" y="74.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Web</text><rect x="40" y="112" width="180" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="130.0" y="146.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">WhatsApp</text><rect x="40" y="184" width="180" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="130.0" y="218.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">SMS</text><path d="M220 68 C270 68 270 140 316 140" fill="none" stroke="#8c959f" stroke-width="1.6"/><path d="M220 140 C270 140 270 140 316 140" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M220 212 C270 212 270 140 316 140" fill="none" stroke="#8c959f" stroke-width="1.6"/><rect x="320" y="100" width="220" height="80" rx="9" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><text x="430.0" y="136.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">One agent</text><text x="430.0" y="158.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">tool calling, no router</text><rect x="700" y="24" width="220" height="42" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="810.0" y="51.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Auth server</text><path d="M540 140 C620 140 620 45 696 45" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="700" y="76" width="220" height="42" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="810.0" y="103.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Quotes server</text><path d="M540 140 C620 140 620 97 696 97" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="700" y="128" width="220" height="42" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="810.0" y="155.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Payments server</text><path d="M540 140 C620 140 620 149 696 149" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="700" y="180" width="220" height="42" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="810.0" y="207.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Policies server</text><path d="M540 140 C620 140 620 201 696 201" fill="none" stroke="#8c959f"