<svg xmlns="http://www.w3.org/2000/svg" width="960" height="214" viewBox="0 0 960 214" role="img" aria-label="Fine-tuning pipeline: SFT with LoRA, then GRPO, merge, and serve with vLLM"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="213" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="40.0" y="40" width="148.8" height="74" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="114.4" y="73.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Base model</text><text x="114.4" y="95.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">Qwen2.5 1.5B-14B</text><rect x="222.8" y="40" width="148.8" height="74" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="297.20000000000005" y="73.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">SFT + LoRA</text><text x="297.20000000000005" y="95.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">with reasoning</text><path d="M190.8 77.0 H218.8" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="405.6" y="40" width="148.8" height="74" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="480.0" y="73.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">GRPO</text><text x="480.0" y="95.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">reward on answers</text><path d="M373.6 77.0 H401.6" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="588.4000000000001" y="40" width="148.8" height="74" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="662.8000000000001" y="73.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Merge</text><text x="662.8000000000001" y="95.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">adapters in</text><path d="M556.4000000000001 77.0 H584.4000000000001" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="771.2" y="40" width="148.8" height="74" rx="9" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><text x="845.6" y="73.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">vLLM</text><text x="845.6" y="95.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">batched serving</text><path d="M739.2 77.0 H767.2" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="40" y="160" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">Unsloth and TRL on rented GPUs, one folder per experiment so every run can be repeated.</text><text x="40" y="186" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">Served with vLLM: continuous batching, many answers at once from one GPU.</text></svg>