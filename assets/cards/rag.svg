<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-label="Hybrid retrieval: meaning search and word search interleaved, answers cite the page"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="309" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="40" y="110" width="190" height="70" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="135.0" y="141.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Question</text><text x="135.0" y="163.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">Kiswahili or English</text><rect x="290" y="40" width="250" height="62" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="415.0" y="67.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Meaning search</text><text x="4