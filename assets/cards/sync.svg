<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-label="Phone pushes unsent rows, server numbers them, phone pulls everything after its last number"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="315" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="40" y="36" width="320" height="236" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="200" y="68" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Phone, local database</text><rect x="60" y="90" width="280" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="76" y="111" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">cow 12 weighed</text><circle cx="320" cy="106" r="5" fill="#c2410c" class="sent"/><rect x="60" y="132" width="280" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="76" y="153" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">cow 7 vaccinated</text><circle cx="320" cy="148" r="5" fill="#c2410c" class="sent"/><rect x="60" y="174" width="280" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="76" y="195" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">cow 3 sold</text><g class="arrive"><rect x="60" y="216" width="280" height="32" rx="6" fill="#fff4ec" stroke="#c2410c"/><text x="76" y="237" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">43  from another phone</text></g><g class="a"><text x="60" y="238" font-size="15" font-weight="600" fill="#c2410c" text-anchor="start">last number seen: 40</text></g><rect x="600" y="36" width="320" height="230" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="760" y="68" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Go server</text><rect x="620" y="90" width="280" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="636" y="111" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">41  cow 12 weighed</text><rect x="620" y="132" width="280" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="636" y="153" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">42  cow 7 vaccinated</text><rect x="620" y="174" width="280" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="636" y="195" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">43  from another phone</text><path d="M366 112 H594" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="480" y="100" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">1. push what&#x27;s unsent</text><path d="M594 216 H366" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="480" y="204" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">2. pull everything after 40</text><text x="40" y="296" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">orange dot = not sent yet</text></svg>