<svg xmlns="http://www.w3.org/2000/svg" width="960" height="306" viewBox="0 0 960 306" role="img" aria-label="Character error falls from 49% to 5.25% with a LoRA fine-tuned 7B vision-language model"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="305" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="40" y="44" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">Character error on held-out lines (lower is better)</text><text x="40" y="93" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Small OCR model (TrOCR)</text><rect x="330" y="75" width="510" height="26" rx="5" fill="#8c959f" class="grow" style="animation-delay:0.0s"/><text x="849.6" y="94" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">49%</text><text x="40" y="151" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">First vision-language try</text><rect x="330" y="133" width="175" height="26" rx="5" fill="#8c959f" class="grow" style="animation-delay:0.25s"/><text x="514.72" y="152" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">16.8%</text><text x="40" y="209" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Qwen2.5-VL 7B + LoRA</text><rect x="330" y="191" width="55" height="26" rx="5" fill="#c2410c" class="grow" style="animation-delay:0.5s"/><text x="394.6" y="210" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">5.25%</text><text x="40" y="267" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">3 fine-tunes vote per word</text><text x="330" y="267" font-size="16" font-weight="650" fill="#c2410c" text-anchor="start">leaderboard 0.898, my best</text></svg>