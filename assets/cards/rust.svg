<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="The same recorded requests sent to the Python and Rust servers give byte-identical answers"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="339" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="40" y="92" width="190" height="70" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="135.0" y="123.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">2,295 recorded</text><text x="135.0" y="145.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">requests</text><rect x="330" y="36" width="220" height="58" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="440.0" y="71.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Python server</text><rect x="330" y="160" width="220" height="58" rx="9" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><text x="440.0" y="195.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Rust server</text><path d="M230 118 C280 118 280 65 326 65" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M230 136 C280 136 280 189 326 189" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="660" y="92" width="260" height="70" rx="9" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><text x="790.0" y="123.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">2,295 / 2,295</text><text x="790.0" y="145.0" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">byte-identical</text><path d="M550 65 C610 65 610 118 656 118" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><path d="M550 189 C610 189 610 136 656 136" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="40" y="272" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">Memory on a phone</text><rect x="200" y="256" width="63" height="14" rx="3" fill="#c2410c"/><text x="275" y="269" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">7 MB idle</text><rect x="200" y="280" width="99" height="14" rx="3" fill="#c2410c"/><text x="311" y="293" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">11 MB 5 people streaming</text><rect x="200" y="304" width="315" height="14" rx="3" fill="#c2410c"/><text x="527" y="317" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">35 MB peak</text></svg>