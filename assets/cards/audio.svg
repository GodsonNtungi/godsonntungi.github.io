<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-label="Audio goes to speech-to-text when a slot is free, otherwise it is kept and caught up later"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l)}55%,100%{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--l);animation:draw 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes aOn{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes bOn{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}.a{animation:aOn 8s ease-in-out infinite}.b{animation:bOn 8s ease-in-out infinite}@keyframes sent{0%,30%{opacity:1}40%,85%{opacity:0}100%{opacity:1}}.sent{animation:sent 7s ease-in-out infinite}@keyframes arrive{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}.arrive{animation:arrive 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.b,.arrive{opacity:1}.a{opacity:0}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x=".5" y=".5" width="959" height="291" rx="14" fill="#ffffff" stroke="#d0d7de"/><rect x="40" y="118" width="130" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="105.0" y="152.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Phone</text><rect x="230" y="118" width="150" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="305.0" y="152.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Server</text><path d="M170 146 H226" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="198" y="110" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">live audio</text><rect x="560" y="40" width="360" height="62" rx="9" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/><text x="740.0" y="77.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Speech to text</text><rect x="560" y="190" width="360" height="62" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="740.0" y="227.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="middle">Keep audio, catch up later</text><path d="M380 136 C470 136 470 71 556 71" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="470" y="92" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">slot free</text><path d="M380 156 C470 156 470 221 556 221" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><text x="470" y="212" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">service full</text><path d="M740 190 V106" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="752" y="154" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">drains when a slot frees</text></svg>