<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Courier New', monospace">
  <!-- Background -->
  <rect width="900" height="520" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">ESP32 + 3.7V LiPo Battery — Proper Wiring Schematic</text>
  <text x="450" y="60" text-anchor="middle" fill="#888" font-size="12">Using HT7333 LDO Voltage Regulator (3.7V → 3.3V)</text>

  <!-- ==================== LIPO BATTERY ==================== -->
  <rect x="40" y="160" width="140" height="200" rx="10" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="110" y="195" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">LiPo Battery</text>
  <text x="110" y="215" text-anchor="middle" fill="#ff6b6b" font-size="12">3.7V</text>

  <!-- Battery symbol inside -->
  <line x1="90" y1="245" x2="130" y2="245" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="100" y1="260" x2="120" y2="260" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="90" y1="275" x2="130" y2="275" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="100" y1="290" x2="120" y2="290" stroke="#ff6b6b" stroke-width="2"/>

  <!-- + and - labels -->
  <text x="75" y="250" fill="#ff6b6b" font-size="18" font-weight="bold">+</text>
  <text x="75" y="295" fill="#ff6b6b" font-size="18" font-weight="bold">-</text>

  <!-- Battery voltage label -->
  <text x="110" y="340" text-anchor="middle" fill="#aaa" font-size="11">3.7V nominal</text>
  <text x="110" y="355" text-anchor="middle" fill="#aaa" font-size="11">4.2V full</text>

  <!-- ==================== WIRES FROM BATTERY ==================== -->
  <!-- Positive wire (red) -->
  <line x1="180" y1="220" x2="280" y2="220" stroke="#ff4444" stroke-width="2.5"/>
  <circle cx="180" cy="220" r="4" fill="#ff4444"/>
  <text x="230" y="212" text-anchor="middle" fill="#ff4444" font-size="10">3.7V (+)</text>

  <!-- Negative wire (black) -->
  <line x1="180" y1="320" x2="280" y2="320" stroke="#666" stroke-width="2.5"/>
  <circle cx="180" cy="320" r="4" fill="#666"/>
  <text x="230" y="340" text-anchor="middle" fill="#888" font-size="10">GND (-)</text>

  <!-- ==================== HT7333 REGULATOR ==================== -->
  <rect x="280" y="170" width="200" height="200" rx="8" fill="none" stroke="#4ecdc4" stroke-width="2.5"/>
  <text x="380" y="200" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">HT7333</text>
  <text x="380" y="218" text-anchor="middle" fill="#4ecdc4" font-size="11">LDO Regulator</text>

  <!-- Regulator chip drawing -->
  <rect x="340" y="240" width="80" height="50" rx="4" fill="#2a2a4a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="380" y="270" text-anchor="middle" fill="#4ecdc4" font-size="10">HT7333</text>

  <!-- Pin labels -->
  <text x="310" y="255" text-anchor="middle" fill="#ff9f43" font-size="10">VIN</text>
  <line x1="280" y1="250" x2="340" y2="250" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="4,2"/>

  <text x="310" y="282" text-anchor="middle" fill="#888" font-size="10">GND</text>
  <line x1="280" y1="278" x2="340" y2="278" stroke="#888" stroke-width="1.5" stroke-dasharray="4,2"/>

  <text x="450" y="255" text-anchor="middle" fill="#2ecc71" font-size="10">VOUT</text>
  <line x1="420" y1="250" x2="480" y2="250" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Input capacitor -->
  <line x1="300" y1="300" x2="300" y2="320" stroke="#ff9f43" stroke-width="1.5"/>
  <rect x="290" y="320" width="20" height="6" fill="none" stroke="#ff9f43" stroke-width="1.5"/>
  <rect x="290" y="330" width="20" height="6" fill="none" stroke="#ff9f43" stroke-width="1.5"/>
  <line x1="300" y1="336" x2="300" y2="356" stroke="#ff9f43" stroke-width="1.5"/>
  <text x="320" y="332" fill="#ff9f43" font-size="9">1uF</text>

  <!-- Output capacitor -->
  <line x1="460" y1="300" x2="460" y2="320" stroke="#2ecc71" stroke-width="1.5"/>
  <rect x="450" y="320" width="20" height="6" fill="none" stroke="#2ecc71" stroke-width="1.5"/>
  <rect x="450" y="330" width="20" height="6" fill="none" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="460" y1="336" x2="460" y2="356" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="440" y="332" fill="#2ecc71" font-size="9" text-anchor="end">1uF</text>

  <!-- GND symbol for caps -->
  <line x1="290" y1="356" x2="310" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="293" y1="360" x2="307" y2="360" stroke="#888" stroke-width="1"/>
  <line x1="296" y1="364" x2="304" y2="364" stroke="#888" stroke-width="0.8"/>

  <line x1="450" y1="356" x2="470" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="453" y1="360" x2="467" y2="360" stroke="#888" stroke-width="1"/>
  <line x1="456" y1="364" x2="464" y2="364" stroke="#888" stroke-width="0.8"/>

  <!-- Wire routing: battery + to VIN -->
  <line x1="280" y1="220" x2="280" y2="250" stroke="#ff4444" stroke-width="2"/>

  <!-- Wire routing: battery GND to regulator GND -->
  <line x1="280" y1="320" x2="280" y2="278" stroke="#666" stroke-width="2"/>

  <!-- ==================== OUTPUT WIRES ==================== -->
  <!-- 3.3V output wire (green) -->
  <line x1="480" y1="250" x2="480" y2="220" stroke="#2ecc71" stroke-width="2.5"/>
  <line x1="480" y1="220" x2="600" y2="220" stroke="#2ecc71" stroke-width="2.5"/>
  <text x="540" y="212" text-anchor="middle" fill="#2ecc71" font-size="10" font-weight="bold">3.3V out</text>

  <!-- GND pass-through -->
  <line x1="480" y1="320" x2="600" y2="320" stroke="#666" stroke-width="2.5"/>
  <line x1="460" y1="300" x2="460" y2="320" stroke="#666" stroke-width="1"/>
  <line x1="460" y1="320" x2="480" y2="320" stroke="#666" stroke-width="2.5"/>
  <text x="540" y="340" text-anchor="middle" fill="#888" font-size="10">GND</text>

  <!-- ==================== ESP32 ==================== -->
  <rect x="600" y="130" width="250" height="300" rx="10" fill="none" stroke="#a29bfe" stroke-width="2.5"/>
  <text x="725" y="165" text-anchor="middle" fill="#a29bfe" font-size="16" font-weight="bold">ESP32</text>
  <text x="725" y="183" text-anchor="middle" fill="#a29bfe" font-size="11">Dev Board</text>

  <!-- ESP32 chip representation -->
  <rect x="660" y="200" width="130" height="80" rx="6" fill="#2a2a4a" stroke="#a29bfe" stroke-width="1.5"/>
  <text x="725" y="235" text-anchor="middle" fill="#a29bfe" font-size="10">ESP32-WROOM</text>
  <text x="725" y="250" text-anchor="middle" fill="#a29bfe" font-size="9">WiFi + BLE</text>
  <circle cx="725" cy="268" r="3" fill="#a29bfe"/>

  <!-- Pin labels on ESP32 -->
  <!-- 3V3 Pin -->
  <rect x="610" y="210" width="40" height="22" rx="3" fill="#2ecc71" fill-opacity="0.2" stroke="#2ecc71" stroke-width="1"/>
  <text x="630" y="225" text-anchor="middle" fill="#2ecc71" font-size="10" font-weight="bold">3V3</text>
  <line x1="600" y1="220" x2="610" y2="220" stroke="#2ecc71" stroke-width="2.5"/>

  <!-- GND Pin -->
  <rect x="610" y="310" width="40" height="22" rx="3" fill="#666" fill-opacity="0.2" stroke="#888" stroke-width="1"/>
  <text x="630" y="325" text-anchor="middle" fill="#ccc" font-size="10" font-weight="bold">GND</text>
  <line x1="600" y1="320" x2="610" y2="320" stroke="#666" stroke-width="2.5"/>

  <!-- Other pins (for reference) -->
  <text x="618" y="260" fill="#666" font-size="8">GPIO 2</text>
  <text x="618" y="275" fill="#666" font-size="8">GPIO 4</text>
  <text x="618" y="290" fill="#666" font-size="8">GPIO 5</text>

  <text x="792" y="225" fill="#666" font-size="8" text-anchor="end">VIN</text>
  <text x="792" y="245" fill="#666" font-size="8" text-anchor="end">GPIO 12</text>
  <text x="792" y="260" fill="#666" font-size="8" text-anchor="end">GPIO 13</text>
  <text x="792" y="275" fill="#666" font-size="8" text-anchor="end">GPIO 14</text>

  <!-- LED indicator -->
  <circle cx="800" y="320" r="5" fill="none" stroke="#2ecc71" stroke-width="1.5"/>
  <circle cx="800" cy="320" r="2" fill="#2ecc71"/>
  <text x="815" y="324" fill="#2ecc71" font-size="8">PWR</text>

  <!-- ==================== WARNING BOX ==================== -->
  <rect x="40" y="420" width="400" height="80" rx="6" fill="#ff6b6b" fill-opacity="0.1" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="55" y="445" fill="#ff6b6b" font-size="12" font-weight="bold">DO NOT connect 3.7V directly to 3V3 pin!</text>
  <text x="55" y="462" fill="#ff6b6b" font-size="11">This bypasses regulation and will overheat/damage</text>
  <text x="55" y="479" fill="#ff6b6b" font-size="11">the ESP32. Always use a regulator in between.</text>

  <!-- ==================== CORRECT BOX ==================== -->
  <rect x="460" y="420" width="400" height="80" rx="6" fill="#2ecc71" fill-opacity="0.1" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="475" y="445" fill="#2ecc71" font-size="12" font-weight="bold">Correct: LiPo → HT7333 → 3V3 Pin</text>
  <text x="475" y="462" fill="#2ecc71" font-size="11">Add 1uF caps on input and output for stability.</text>
  <text x="475" y="479" fill="#2ecc71" font-size="11">HT7333 handles 2.5V–12V input, outputs 3.3V.</text>

  <!-- ==================== FLOW ARROWS ==================== -->
  <!-- Arrow 1: Battery to Regulator -->
  <polygon points="275,200 285,195 285,205" fill="#ff9f43"/>
  <text x="230" y="198" text-anchor="middle" fill="#ff9f43" font-size="9">3.7V in</text>

  <!-- Arrow 2: Regulator to ESP32 -->
  <polygon points="595,215 605,210 605,220" fill="#2ecc71"/>
  <text x="555" y="200" text-anchor="middle" fill="#2ecc71" font-size="9">3.3V out</text>
</svg>